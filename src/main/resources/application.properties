# Nombre de la aplicación
spring.application.name=productos-api

# Modificamos la URL para que empiece por JDBC y lea la URI unificada de Render
spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL}?sslmode=require

# Driver de conexión para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Forzamos el dialecto en el código para que no dependa de los metadatos en frío
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto dinámico asignado por Render para internet
server.port=${PORT:8080}

# Hibernate creará las tablas automáticamente en la nube al arrancar
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas en la consola de Render
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true