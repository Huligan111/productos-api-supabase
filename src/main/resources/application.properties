# Nombre de la aplicación
spring.application.name=productos-api

# URL de conexión adaptada con sslmode obligatorio para servidores externos
spring.datasource.url=jdbc:postgresql://db.xgbxllmuwyunldoqnesp.supabase.co:5432/postgres?sslmode=require

# Credenciales de acceso (la contraseña se inyecta desde Render)
spring.datasource.username=postgres

# Driver para conexión con PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# El puerto dinámico indispensable para internet
#Hacer que el puerto sea dinámico
#Usa el puerto que te asigne el servidor de internet, y si no hay ninguno
# (como cuando estás en tu ordenador local), usa el 8080 por defecto
server.port=${PORT:8080}

# Hibernate creará las tablas automáticamente en la nube al arrancar
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas en la consola de Render
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true