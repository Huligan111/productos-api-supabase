# Nombre de la aplicación
spring.application.name=productos-api

# URL CORRECTA: Conectando al pooler IPv4 en la región eu-north-1
spring.datasource.url=jdbc:postgresql://://supabase.com

# Tu usuario exacto de Supabase
spring.datasource.username=postgres.xgbxllmuwyunldoqnesp
# La contraseña secreta se inyecta dinámicamente desde el panel de Render
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver de conexión para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Puerto dinámico asignado por Render para internet
server.port=${PORT:8080}

# Hibernate creará las tablas automáticamente en Supabase al arrancar
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola de Render
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true