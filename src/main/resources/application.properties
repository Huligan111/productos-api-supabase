# Nombre de la aplicación
spring.application.name=productos-api

# URL CORRECTA: Con tu host real de Europa del Norte y el puerto 6543 del Pooler
spring.datasource.url=jdbc:postgresql://://supabase.com

# Tu usuario exacto de la captura de pantalla
spring.datasource.username=postgres.xgbxllmuwyunldoqnesp
# La contraseña secreta se inyecta desde tu panel de Render
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver para conexión con PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto explícito para evitar fallos de reconocimiento en frío
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# El puerto dinámico indispensable para internet
server.port=${PORT:8080}

# Hibernate creará las tablas automáticamente en la nube al arrancar
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas en la consola de Render
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true